name: Linux profile runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/tool/development_runtime_smoke/**"
      - "app/test/development_plugin_runtime_test.dart"
      - "app/test/development_resource_inspector_eval_test.dart"
      - "app/test/development_workspace_demo_eval_test.dart"
      - "app/lib/frontend/interpreted_widget.dart"
      - "app/pubspec.yaml"
      - "packages/plugin_backend_host/**"
      - "packages/contract/**"
      - "packages/contract_codegen/**"
      - "packages/capabilities/**"
      - "packages/plugin_builder/**"
      - "packages/plugin_api/**"
      - "packages/plugin_runtime/**"
      - "plugins/workspace_demo/**"
      - "plugins/resource_inspector/**"
      - "tools/adele.dart"
      - "tools/code_editor_probe.dart"
      - "tools/code_editor_probe/**"
      - "test/tools/code_editor_probe_test.dart"
      - "tools/contract_artifacts.dart"
      - "contract_codegen.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "toolchain.json"
      - ".tool-versions"
      - ".github/workflows/runtime-smoke.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-editor-candidate:
    name: Reproduce rejected CodeForge candidate (not E1 acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop and probe dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb curl binutils
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true
      - name: Prepare exact experiment Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --target x86_64-unknown-linux-gnu
      - name: Reproduce native profile proof and known editing defects
        run: >-
          dart tools/adele.dart probe-code-editor
          --output "${{ runner.temp }}/code-editor-probe" --verify-known-defects
      - name: Retain diagnostic logs only, not redistribution-unready binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-codeforge-candidate-logs
          path: ${{ runner.temp }}/code-editor-probe/logs/
          if-no-files-found: ignore
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true
      - run: dart tools/adele.dart bootstrap
      - name: Check materialized contract determinism
        run: dart tools/adele.dart generate --check
      - name: Run profile vertical smoke
        env:
          ADELE_DEVELOPMENT_REPOSITORY_ROOT: ${{ github.workspace }}
          ADELE_DEVELOPMENT_PLUGIN_DIRECTORY: ${{ github.workspace }}/plugins/workspace_demo
          ADELE_DEVELOPMENT_DIRECTORY: ${{ github.workspace }}/.dart_tool/adele/smoke-root
        run: |
          mkdir -p "$ADELE_DEVELOPMENT_DIRECTORY"
          printf 'profile smoke text\n' > "$ADELE_DEVELOPMENT_DIRECTORY/profile.txt"
          xvfb-run -a dart tools/adele.dart smoke linux --profile
