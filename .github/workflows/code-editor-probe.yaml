name: CodeForge native investigation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/adele.dart"
      - "tools/code_editor_probe.dart"
      - "tools/code_editor_probe/**"
      - "test/tools/code_editor_probe_test.dart"
      - "test/tools/code_editor_smoke_settlement_test.dart"
      - "toolchain.json"
      - ".tool-versions"
      - ".github/workflows/code-editor-probe.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-baseline:
    name: CodeForge 10.14.0 reproduction (not E1 acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop and probe dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb curl binutils
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true
      - name: Prepare exact experiment Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --target x86_64-unknown-linux-gnu
      - name: Run corrected packaging smoke and versioned baseline observations
        run: >-
          dart tools/adele.dart probe-code-editor
          --output "${{ runner.temp }}/code-editor-probe" --verify-known-defects
      - name: Retain diagnostics only, not native binaries or fonts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeforge-investigation-logs
          path: ${{ runner.temp }}/code-editor-probe/logs/
          if-no-files-found: ignore
