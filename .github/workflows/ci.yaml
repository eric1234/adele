name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Check formatting
        run: dart tools/adele.dart format --check

  generated:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: dart tools/adele.dart bootstrap

      - name: Check generated contracts
        run: dart tools/adele.dart generate --check

  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: dart tools/adele.dart bootstrap

      - name: Analyze packages
        run: dart tools/adele.dart analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: dart tools/adele.dart bootstrap

      - name: Run tests
        run: dart tools/adele.dart test --jobs 4

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: dart tools/adele.dart bootstrap

      - name: Build Linux desktop profile
        run: dart tools/adele.dart build linux --profile
