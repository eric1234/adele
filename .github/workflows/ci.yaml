name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Check formatting
        run: dart tools/adele.dart format --check

  generated:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: dart tools/adele.dart bootstrap

      - name: Check generated contracts
        run: dart tools/adele.dart generate --check

  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: dart tools/adele.dart bootstrap

      - name: Analyze packages
        run: dart tools/adele.dart analyze

  discover-test-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.test-plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Discover test targets
        id: test-plan
        run: echo "matrix=$(dart tools/adele.dart test-plan --json)" >> "$GITHUB_OUTPUT"

  test-target:
    needs: discover-test-targets
    name: test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-test-targets.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: ${{ matrix.linuxDesktopDeps }}
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: dart tools/adele.dart bootstrap

      - name: Run test target
        run: dart tools/adele.dart test --target "${{ matrix.name }}"

  test:
    name: test
    if: always()
    needs:
      - discover-test-targets
      - test-target
    runs-on: ubuntu-latest
    steps:
      - name: Require all test targets to pass
        env:
          DISCOVERY_RESULT: ${{ needs.discover-test-targets.result }}
          TEST_TARGET_RESULT: ${{ needs.test-target.result }}
        run: |
          test "$DISCOVERY_RESULT" = success
          test "$TEST_TARGET_RESULT" = success

  # TEMPORARY: Compare package-local concurrency before setting CI policy.
  contract-codegen-benchmark:
    name: contract_codegen benchmark / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            concurrency: 0
          - variant: 2
            concurrency: 2
          - variant: 3
            concurrency: 3
          - variant: 4
            concurrency: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Bootstrap workspace
        run: dart tools/adele.dart bootstrap

      - name: Report runner and Dart toolchain
        run: |
          nproc
          dart --version

      - name: Benchmark default concurrency
        if: matrix.variant == 'default'
        working-directory: packages/contract_codegen
        run: time dart test

      - name: Benchmark explicit concurrency
        if: matrix.variant != 'default'
        working-directory: packages/contract_codegen
        run: time dart test --concurrency "${{ matrix.concurrency }}"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: dart tools/adele.dart bootstrap

      - name: Build Linux desktop profile
        run: dart tools/adele.dart build linux --profile
