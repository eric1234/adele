name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: dart tools/adele.dart bootstrap

      - name: Check formatting
        run: dart tools/adele.dart format --check

      - name: Analyze packages
        run: dart tools/adele.dart analyze

      - name: Run tests
        run: dart tools/adele.dart test

      - name: Prove pure-Dart AOT loader
        run: |
          mkdir -p .dart_tool/adele/phase1/ci
          dart compile aot-snapshot packages/plugin_backend_host/bin/adele_backend_host.dart -o .dart_tool/adele/phase1/ci/backend-host.aot
          dart compile aot-snapshot plugins/workspace_demo/packages/backend/bin/workspace_demo_backend.dart -o .dart_tool/adele/phase1/ci/workspace-demo.aot
          dart run tools/experiments/phase1/backend_host_gate2.dart "$(dirname "$(which flutter)")/cache/dart-sdk/bin/dartaotruntime" .dart_tool/adele/phase1/ci/backend-host.aot .dart_tool/adele/phase1/ci/workspace-demo.aot .

      - name: Build Linux desktop profile
        run: dart tools/adele.dart build linux --profile
