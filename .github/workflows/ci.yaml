name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: dart tools/adele.dart bootstrap

      - name: Check formatting
        run: dart tools/adele.dart format --check

      - name: Analyze packages
        run: dart tools/adele.dart analyze

      - name: Run tests
        run: dart tools/adele.dart test

      - name: Build Linux desktop shell
        run: dart tools/adele.dart build linux
