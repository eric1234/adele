name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Check formatting
        run: dart tools/adele.dart format --check

  generated:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: dart tools/adele.dart bootstrap

      - name: Check materialized contract determinism
        run: dart tools/adele.dart generate --check

  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Resolve workspace dependencies
        run: dart tools/adele.dart resolve-workspace

      - name: Analyze packages
        run: dart tools/adele.dart analyze

  discover-test-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.test-plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Discover test targets
        id: test-plan
        run: echo "matrix=$(dart tools/adele.dart test-plan --json)" >> "$GITHUB_OUTPUT"

      - name: Prepare configured contract sources
        if: github.event_name != 'workflow_dispatch'
        run: |
          python3 -B -m unittest discover -s test -p ci_contract_sources_test.py
          dart tools/adele.dart resolve-workspace
          python3 tools/ci_contract_sources.py produce "$RUNNER_TEMP/contracts.json"

      - name: Publish generated contract sources
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contracts.json
          if-no-files-found: error
          retention-days: 1

  test-target:
    needs: discover-test-targets
    name: test / ${{ matrix.displayName }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-test-targets.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: ${{ matrix.linuxDesktopDeps }}
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev binutils

      - name: Install Linux PTY test prerequisites
        if: ${{ matrix.linuxPtyDeps }}
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Install pinned native compiler
        if: ${{ matrix.nativeCodeEditor || matrix.nativeToml || matrix.name == 'adele_credential_store' || matrix.name == 'adele_credential_store_native' }}
        run: rustup toolchain install 1.93.0 --profile minimal --target x86_64-unknown-linux-gnu

      - name: Install credential native build tools
        if: ${{ matrix.name == 'adele_credential_store' || matrix.name == 'adele_credential_store_native' }}
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev binutils

      - name: Install credential native linter
        if: ${{ matrix.name == 'adele_credential_store_native' }}
        run: rustup component add clippy --toolchain 1.93.0

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Resolve workspace dependencies
        run: dart tools/adele.dart resolve-workspace

      # Fetch bytes, not an extracted directory. Only the verified source
      # inventory is materialized, inside the maintained test launcher.
      - name: Download generated contract sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo 'Fresh generation: dispatch or retry; not consulting artifacts from prior attempts.'
            exit 0
          fi
          name="contracts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          api="repos/$GITHUB_REPOSITORY/actions"
          id=$(gh api "$api/runs/$GITHUB_RUN_ID/artifacts?name=$name" --jq '
            if .total_count == 1 and (.artifacts[0].expired == false)
            then .artifacts[0].id else error("Expected exactly one current contract artifact") end')
          gh api "$api/artifacts/$id/zip" > "$RUNNER_TEMP/contracts.zip"
          echo "ADELE_CI_CONTRACT_BUNDLE=$RUNNER_TEMP/contracts.zip" >> "$GITHUB_ENV"

      - name: Run test target
        env:
          TEST_TARGET: ${{ matrix.name }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          args=(test --target "$TEST_TARGET" --ci)
          if [[ -n "$TEST_SHARD" ]]; then
            args+=(--shard "$TEST_SHARD")
          fi
          if [[ -n "${ADELE_CI_CONTRACT_BUNDLE:-}" ]]; then
            args+=("--ci-contracts=$ADELE_CI_CONTRACT_BUNDLE")
            unset ADELE_CI_CONTRACT_BUNDLE
          fi
          dart tools/adele.dart "${args[@]}"

  test:
    name: test
    if: always()
    needs:
      - discover-test-targets
      - test-target
    runs-on: ubuntu-latest
    steps:
      - name: Require all test targets to pass
        env:
          DISCOVERY_RESULT: ${{ needs.discover-test-targets.result }}
          TEST_TARGET_RESULT: ${{ needs.test-target.result }}
        run: |
          test "$DISCOVERY_RESULT" = success
          test "$TEST_TARGET_RESULT" = success

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev gcc libc6-dev binutils

      - name: Install pinned native compiler
        run: rustup toolchain install 1.93.0 --profile minimal --target x86_64-unknown-linux-gnu

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Bootstrap workspace
        run: dart tools/adele.dart bootstrap

      - name: Build Linux desktop profile
        run: dart tools/adele.dart build linux --profile
